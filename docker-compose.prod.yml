# Server overlay (used on AWS): docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# - Only Caddy is reachable from outside (ports 80/443): automatic HTTPS + a login prompt.
# - Postgres, RabbitMQ, the API and the worker publish no ports; they talk on the internal network.
# - Secrets come from .env (generated by deploy/aws/user-data.sh), never from defaults.

services:
  postgres:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

  rabbitmq:
    ports: !reset []
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}

  api:
    ports: !reset []

  worker:
    ports: !reset []

  web:
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:-}
    volumes:
      # Caddyfile = login required (default); Caddyfile.public = no login (set CADDYFILE in .env).
      - ./deploy/${CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy-data:/data        # certificates survive restarts
      - caddy-config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
