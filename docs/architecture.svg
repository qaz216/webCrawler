<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" width="1180" height="470" role="img" aria-labelledby="title desc">
  <title id="title">Web Crawler architecture</title>
  <desc id="desc">The React UI calls the Crawl API over HTTP and polls for status. The API stores jobs in PostgreSQL and publishes the root crawl task to RabbitMQ through the transactional outbox. The Crawl Worker consumes page tasks, fetches target websites, writes pages, links and child tasks (via the outbox) to PostgreSQL, and the child tasks are published back to RabbitMQ.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; stroke: #e2e8f0; }
      .title { font: 700 18px Inter, "Segoe UI", system-ui, sans-serif; fill: #0f172a; }
      .name { font: 700 15px Inter, "Segoe UI", system-ui, sans-serif; fill: #0f172a; }
      .sub { font: 400 12.5px Inter, "Segoe UI", system-ui, sans-serif; fill: #475569; }
      .label { font: 500 12.5px Inter, "Segoe UI", system-ui, sans-serif; fill: #334155; }
      .flow { stroke: #475569; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .flow2 { stroke: #475569; stroke-width: 1.8; fill: none; marker-start: url(#arrow); marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" x="1" y="1" width="1178" height="468" rx="16"/>
  <text class="title" x="32" y="40">Web Crawler · architecture</text>

  <!-- React UI -->
  <rect x="32" y="80" width="180" height="90" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text class="name" x="122" y="118" text-anchor="middle">React UI</text>
  <text class="sub" x="122" y="140" text-anchor="middle">Vite · TanStack Query</text>

  <!-- Crawl API -->
  <rect x="312" y="70" width="240" height="110" rx="14" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text class="name" x="432" y="104" text-anchor="middle">Service A · Crawl API</text>
  <text class="sub" x="432" y="126" text-anchor="middle">ASP.NET Core 8 (orchestrator)</text>
  <text class="sub" x="432" y="146" text-anchor="middle">creates jobs · serves status,</text>
  <text class="sub" x="432" y="164" text-anchor="middle">tree and history</text>

  <!-- RabbitMQ -->
  <rect x="700" y="70" width="240" height="110" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text class="name" x="820" y="104" text-anchor="middle">RabbitMQ</text>
  <text class="sub" x="820" y="126" text-anchor="middle">crawl.pages (quorum queue)</text>
  <text class="sub" x="820" y="146" text-anchor="middle">retry tiers 5s · 30s · 2m</text>
  <text class="sub" x="820" y="164" text-anchor="middle">dead-letter queue</text>

  <!-- PostgreSQL -->
  <rect x="312" y="320" width="240" height="110" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text class="name" x="432" y="354" text-anchor="middle">PostgreSQL</text>
  <text class="sub" x="432" y="376" text-anchor="middle">crawl_jobs · pages · page_links</text>
  <text class="sub" x="432" y="396" text-anchor="middle">outbox_messages</text>
  <text class="sub" x="432" y="414" text-anchor="middle">unique keys = idempotency</text>

  <!-- Crawl Worker -->
  <rect x="700" y="320" width="240" height="110" rx="14" fill="#fdf4ff" stroke="#a21caf" stroke-width="2"/>
  <text class="name" x="820" y="354" text-anchor="middle">Service B · Crawl Worker</text>
  <text class="sub" x="820" y="376" text-anchor="middle">fetch · parse · Domain Link Ratio</text>
  <text class="sub" x="820" y="396" text-anchor="middle">content de-dup · retries</text>
  <text class="sub" x="820" y="414" text-anchor="middle">idempotent page handler</text>

  <!-- Target websites -->
  <rect x="1010" y="335" width="140" height="80" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text class="name" x="1080" y="370" text-anchor="middle">Websites</text>
  <text class="sub" x="1080" y="391" text-anchor="middle">SSRF-guarded</text>

  <!-- UI ⇄ API -->
  <line class="flow" x1="212" y1="110" x2="310" y2="110"/>
  <text class="label" x="261" y="100" text-anchor="middle">HTTP /api</text>
  <line class="flow" x1="312" y1="142" x2="214" y2="142"/>
  <text class="label" x="261" y="162" text-anchor="middle">JSON · polling</text>

  <!-- API → RabbitMQ -->
  <line class="flow" x1="552" y1="125" x2="698" y2="125"/>
  <text class="label" x="626" y="115" text-anchor="middle">publish root task</text>
  <text class="label" x="626" y="145" text-anchor="middle">(via outbox)</text>

  <!-- API ⇄ PostgreSQL -->
  <line class="flow2" x1="432" y1="182" x2="432" y2="318"/>
  <text class="label" x="444" y="244">create jobs</text>
  <text class="label" x="444" y="262">read status · tree · history</text>

  <!-- RabbitMQ → Worker -->
  <line class="flow" x1="780" y1="180" x2="780" y2="318"/>
  <text class="label" x="770" y="244" text-anchor="end">consume</text>
  <text class="label" x="770" y="262" text-anchor="end">CrawlPageTask</text>

  <!-- Worker → RabbitMQ (child tasks) -->
  <line class="flow" x1="870" y1="320" x2="870" y2="182"/>
  <text class="label" x="882" y="244">publish child tasks</text>
  <text class="label" x="882" y="262">(via outbox)</text>

  <!-- Worker → PostgreSQL -->
  <line class="flow" x1="700" y1="375" x2="554" y2="375"/>
  <text class="label" x="626" y="365" text-anchor="middle">write pages, links</text>
  <text class="label" x="626" y="395" text-anchor="middle">+ outbox</text>

  <!-- Worker → Websites -->
  <line class="flow" x1="940" y1="375" x2="1008" y2="375"/>
  <text class="label" x="974" y="365" text-anchor="middle">GET</text>
</svg>
