name: webcrawler

# Local development stack. Credentials default to throwaway values; override them via environment
# variables or a .env file (the AWS setup generates random ones — see deploy/aws/README.md).
# For a server, add docker-compose.prod.yml: it closes these ports and puts Caddy (HTTPS + login) in front.

x-app-env: &app-env
  ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=crawler;Username=crawler;Password=${POSTGRES_PASSWORD:-crawler}
  RabbitMq__Uri: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crawler
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crawler}
      POSTGRES_DB: crawler
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crawler -d crawler"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/Crawler.Api/Dockerfile
    environment: *app-env
    ports:
      - "8080:8080"    # REST API, /swagger, /health/live, /health/ready
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: src/Crawler.Worker/Dockerfile
    environment: *app-env
    ports:
      - "8081:8080"    # /health/live, /health/ready
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
    ports:
      - "3000:80"      # React UI; /api is proxied to the api service
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres-data:
  rabbitmq-data:
